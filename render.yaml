services:
  - type: web
    name: findjobph
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /jobs
    envVars:
      - key: APP_NAME
        value: Findjobph
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: test
      - key: DB_USERNAME
        value: 3pfD49M23rdPf1y.root
      - key: DB_PASSWORD
        value: jnyfj7CoUL6DKYby
      - key: MYSQL_ATTR_SSL_CA
        value: "true"
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
