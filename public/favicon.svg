<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
    <defs>
        <!-- Gradient for Circular Base -->
        <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="50%" stop-color="#0369a1" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
        <!-- Philippine Sun Golden Rays Gradient -->
        <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#fde047" />
        </linearGradient>
        <!-- Location Pin Cyan/Azure Gradient -->
        <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <!-- Soft Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35" />
        </filter>
    </defs>

    <!-- Circular Badge with Transparent Exterior (Circle No Background) -->
    <circle cx="64" cy="64" r="62" fill="url(#favBg)" />
    <circle cx="64" cy="64" r="61" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2" />

    <!-- Philippine Sun Emblem -->
    <g fill="url(#sunGrad)" opacity="0.98">
        <!-- Sun Rays -->
        <polygon points="64,12 60.5,27 67.5,27" />
        <polygon points="100,28 88.5,37 93.5,42" />
        <polygon points="116,64 101,60.5 101,67.5" />
        <polygon points="28,28 34.5,42 39.5,37" />
        <polygon points="12,64 27,67.5 27,60.5" />
        <polygon points="84,18 76.5,31 82,33.5" />
        <polygon points="44,18 46,33.5 51.5,31" />
        <!-- Sun Core Disc -->
        <circle cx="64" cy="46" r="17" fill="url(#sunGrad)" />
    </g>

    <!-- Modern Job Briefcase -->
    <rect x="29" y="50" width="70" height="48" rx="10" fill="#ffffff" filter="url(#shadow)" />
    <!-- Briefcase Handle -->
    <path d="M47,50 V41 C47,36 51,33 56,33 H72 C77,33 81,36 81,41 V50" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M29,69 L53,82 H75 L99,69" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Geo-Location Pin -->
    <g transform="translate(64, 73)" filter="url(#shadow)">
        <path d="M0,-23 C-11,-23 -18,-16 -18,-6 C-18,7 0,22 0,22 C0,22 18,7 18,-6 C18,-16 11,-23 0,-23 Z" fill="url(#pinGrad)" />
        <circle cx="0" cy="-8" r="6" fill="#ffffff" />
    </g>
</svg>
